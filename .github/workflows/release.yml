name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release tag
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ.' }
      - name: Build and check desktop and optional runtime packages
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/workbench-release"
      - name: Test installer and packaged app on a clean Windows runner
        shell: pwsh
        run: ./scripts/test-package.ps1 -AssetsDirectory "$env:RUNNER_TEMP/workbench-release/assets" -AllowInstall
      - name: Retain packages and verification report
        uses: actions/upload-artifact@v4
        with:
          name: crimson-workbench-windows
          path: |
            ${{ runner.temp }}/workbench-release/assets/*
            ${{ runner.temp }}/workbench-release/build-result.json
            ${{ runner.temp }}/workbench-release/package-test/**
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crimson-workbench-windows
          path: release
      - name: Publish tested preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/assets/* --verify-tag --prerelease \
            --title "Crimson Workbench $GITHUB_REF_NAME (Preview)" \
            --notes-file docs/RELEASE_NOTES.md
