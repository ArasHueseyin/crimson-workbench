[package]
name = "cd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Read-only Crimson Workbench data core"

[dependencies]
crimson-format = { path = "../../vendor/crimson-format" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1 = "=0.10.6"
thiserror.workspace = true
rusqlite.workspace = true
image = { version = "0.25", default-features = false, features = ["dds", "png"] }
base64 = "0.22"
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
