[package]
name = "crimson-format"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
c_abi = []

[dependencies]
chacha20_crate = { package = "chacha20", version = "0.10.0" }
lz4_flex = "0.11"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
