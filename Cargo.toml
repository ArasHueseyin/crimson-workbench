[workspace]
members = ["crates/cd-core", "crates/cd-cli", "vendor/crimson-format", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.27"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.2", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
