name: Core
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm run build --prefix app
      - run: npm test --prefix app
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p app --features custom-protocol --locked
      - name: Isolated repair action and native contracts (no game files)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./runtime/repair/test.ps1
      - name: Headless frontend flows
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run test:e2e
