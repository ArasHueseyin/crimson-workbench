name: Core
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --prefix app --no-audit --no-fund
      - run: npm run build --prefix app
      - run: npm test --prefix app
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --nocapture
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p app --features custom-protocol --locked
      - name: Native Mac policy and app bundle (no game files)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          make -C runtime/macos-items all test
          npm run tauri --prefix app -- build --bundles app -- --locked
          bundle="target/release/bundle/macos/Crimson Workbench.app"
          module="$bundle/Contents/Resources/libCrimsonItems.dylib"
          cmp .local/macos-items/libCrimsonItems.dylib "$module"
          digest=$(/usr/bin/shasum -a 256 "$module" | awk '{print $1}')
          grep -aF "$digest" "$bundle/Contents/MacOS/crimson-workbench" >/dev/null
          codesign --verify --deep --strict "$bundle"
      - name: Mac browser flows
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npx --no-install playwright install chromium
          npm run test:e2e -- tests/setup.spec.ts tests/item-picker.spec.ts tests/mounts.spec.ts tests/mac-mods.spec.ts
      - name: Isolated repair action and native contracts (no game files)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./runtime/repair/test.ps1
      - name: Headless frontend flows
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run test:e2e
      - name: Native runtime and package contracts (no game files)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-native.ps1 -OutputDirectory "$env:RUNNER_TEMP/workbench-runtime"
          ./scripts/test-runtime-package.ps1 -PackageDirectory "$env:RUNNER_TEMP/workbench-runtime"
          ./scripts/test-marketplace-package.ps1 -PackageDirectory "$env:RUNNER_TEMP/workbench-runtime"
