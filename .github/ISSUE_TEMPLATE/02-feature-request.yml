name: Feature request
description: Suggest a new Workbench feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please check existing requests first. For changes to game behavior, use the Mod request form.
  - type: textarea
    id: feature
    attributes:
      label: What would you like Workbench to do?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this help?
      description: Explain the task or problem this would make easier.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or additional details
      description: Screenshots, sketches, and alternative ideas are welcome.
